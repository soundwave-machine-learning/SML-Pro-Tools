[package]
name = "soundcraft-playback"
description = "SoundCraft audio device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-time.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-dsp.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[features]
# ASIO as a Windows audio host (cpal's `asio`): needs the Steinberg ASIO SDK accepted and
# installed by the builder (set CPAL_ASIO_DIR, or cpal's build script fetches it itself), LLVM
# (LIBCLANG_PATH) and the MSVC toolchain. Off by default; WASAPI is always built in.
# See docs/remote_continuation/WINDOWS_AUDIO_BACKENDS.md.
asio = ["cpal/asio"]

[dev-dependencies]
soundcraft-speech.workspace = true
soundcraft-mix = { workspace = true, features = ["test-providers"] }
soundcraft-audio-io.workspace = true

[lints]
workspace = true
