[package]
name = "soundcraft-wasapi-native"
description = "SoundCraft native WASAPI output: exclusive mode and IAudioClient3 low-latency shared mode, event-driven (an isolated unsafe FFI crate; Windows only, safe stubs elsewhere)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The same `windows` release cpal 0.16 already uses (no new crate in the dependency tree).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54.0", features = [
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_Devices_Properties",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

# An isolated unsafe helper crate (craftrules never-crash), like soundcraft-vst3-host: this crate
# opts out of the workspace `unsafe_code = "forbid"` for itself only. It denies unsafe everywhere
# and allows it solely on the FFI module (`src/ffi.rs`). The rest mirrors `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
