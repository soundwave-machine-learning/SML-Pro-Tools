[package]
name = "soundcraft-mix"
description = "SoundCraft mix engine: renders a session's tracks, plugins, sends, busses and automation to audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Deterministic test-only providers (`test:` ids) for slot/graph fixtures. Never shipping.
test-providers = []

[dependencies]
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-midi.workspace = true
soundcraft-dsp.workspace = true
soundcraft-clap-host.workspace = true
soundcraft-vst3-host.workspace = true
soundcraft-au-host.workspace = true
soundcraft-model.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[dev-dependencies]
stats_alloc = "0.1"
soundcraft-mix = { path = ".", features = ["test-providers"] }

[lints]
workspace = true
